name: Build VST3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Get JUCE
      run: git clone --depth 1 --branch 8.0.0 https://github.com/juce-framework/JUCE.git C:/JUCE

    - name: Configure CMake
      run: cmake -B build -DJUCE_DIR=C:/JUCE -DCMAKE_BUILD_TYPE=Release

    - name: Build Plugin
      run: cmake --build build --config Release

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AlmightyPain-VST3
        path: build/**/*_artefacts/Release/VST3/*.vst3
