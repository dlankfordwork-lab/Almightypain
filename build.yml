name: Build ALMIGHTY PAIN (VST3)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach files to a GitHub Release on tag pushes

env:
  JUCE_VERSION: "8.0.4"
  BUILD_TYPE: Release

jobs:
  build-windows:
    name: Windows VST3
    runs-on: windows-latest

    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_VERSION }}
          path: JUCE

      - name: Configure (CMake)
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Locate and package the VST3
        shell: pwsh
        run: |
          # The VST3 is a bundle folder; the binary inside it also ends in .vst3,
          # so pick the shortest path to get the top-level bundle.
          $bundle = Get-ChildItem -Path build -Recurse -Filter *.vst3 |
            Sort-Object { $_.FullName.Length } |
            Select-Object -First 1

          if (-not $bundle) { throw "No .vst3 found in build output" }
          Write-Host "Found: $($bundle.FullName)"

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -Path $bundle.FullName -Destination dist -Recurse
          Compress-Archive -Path "dist/*" -DestinationPath "ALMIGHTY-PAIN-win64-vst3.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALMIGHTY-PAIN-win64-vst3
          path: ALMIGHTY-PAIN-win64-vst3.zip
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ALMIGHTY-PAIN-win64-vst3.zip
